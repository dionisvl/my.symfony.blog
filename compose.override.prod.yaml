services:
  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--log.level=WARN"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http3"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--tracing.otlp=true"
      - "--tracing.otlp.http=true"
      - "--tracing.otlp.http.endpoint=http://jaeger:4318/v1/traces"
      - "--tracing.serviceName=traefik"
      - "--tracing.addInternals=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # for HTTP/3 UDP traffic
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.phpqa.ru`) || Host(`traefik.web3main.pro`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${DASHBOARD_AUTH}"
      - "traefik.http.routers.dashboard.tls.certresolver=myresolver"

  pets-app:
    image: ${DOCKER_REGISTRY_SERVER}/pets-app:latest
    volumes:
      - /var/www/pets.phpqa.ru/app:/app:rw
    labels:
      - "traefik.enable=true"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.pets-http.rule=Host(`pets.phpqa.ru`) || Host(`pets.web3main.pro`)"
      - "traefik.http.routers.pets-http.entrypoints=web"
      #      - "traefik.http.routers.pets-http.middlewares=pets-https-redirect"
      #      - "traefik.http.middlewares.pets-https-redirect.redirectscheme.scheme=https"
      # HTTPS configuration
      - "traefik.http.routers.pets-secure.rule=Host(`pets.phpqa.ru`) || Host(`pets.web3main.pro`)"
      - "traefik.http.routers.pets-secure.entrypoints=websecure"
      - "traefik.http.routers.pets-secure.tls=true"
      - "traefik.http.routers.pets-secure.tls.certresolver=myresolver"
      - "traefik.http.services.pets.loadbalancer.server.port=80"
    networks:
      - app-network

  symfony:
    image: ${DOCKER_REGISTRY_SERVER}/phpqa-api:latest
    #build:
    #  target: prod
    #    volumes:
    #      - ./api-symfony/php/conf.d/opcache.prod.ini:/usr/local/etc/php/conf.d/opcache.prod.ini:ro
    labels:
      - "traefik.enable=true"

      # OLD DOMAIN - HTTP - redirect to HTTPS
      - "traefik.http.routers.symfony-old-http.rule=Host(`phpqa.ru`) || Host(`www.phpqa.ru`)"
      - "traefik.http.routers.symfony-old-http.entrypoints=web"
      - "traefik.http.routers.symfony-old-http.service=symfony"

      # OLD DOMAIN - HTTPS - redirect to web3main.pro
      - "traefik.http.routers.symfony-old-https.rule=Host(`phpqa.ru`) || Host(`www.phpqa.ru`)"
      - "traefik.http.routers.symfony-old-https.entrypoints=websecure"
      - "traefik.http.routers.symfony-old-https.tls.certresolver=myresolver"
      - "traefik.http.routers.symfony-old-https.service=symfony"

      # NEW DOMAIN - Symfony serves ONLY admin/login/logout; public front is Astro.
      # HTTP (admin area)
      - "traefik.http.routers.symfony-http.rule=(Host(`web3main.pro`) || Host(`www.web3main.pro`)) && (PathPrefix(`/admin`) || Path(`/login`) || Path(`/logout`))"
      - "traefik.http.routers.symfony-http.entrypoints=web"
      - "traefik.http.routers.symfony-http.priority=50"
      - "traefik.http.routers.symfony-http.service=symfony"

      # HTTPS (admin area, main)
      - "traefik.http.routers.symfony.rule=(Host(`web3main.pro`) || Host(`www.web3main.pro`)) && (PathPrefix(`/admin`) || Path(`/login`) || Path(`/logout`))"
      - "traefik.http.routers.symfony.entrypoints=websecure"
      - "traefik.http.routers.symfony.priority=50"
      - "traefik.http.routers.symfony.tls.certresolver=myresolver"
      - "traefik.http.routers.symfony.service=symfony"

      # Admin-only static assets served by Symfony (Astro owns /css/front.css etc.).
      - "traefik.http.routers.symfony-admin-assets.rule=(Host(`web3main.pro`) || Host(`www.web3main.pro`)) && (Path(`/css/admin.css`) || Path(`/css/some_admin_fix.css`) || Path(`/css/bootstrap5-adminlte-compat.css`) || Path(`/js/admin.js`) || Path(`/js/some_fix_admin.js`))"
      - "traefik.http.routers.symfony-admin-assets.entrypoints=websecure"
      - "traefik.http.routers.symfony-admin-assets.priority=70"
      - "traefik.http.routers.symfony-admin-assets.tls.certresolver=myresolver"
      - "traefik.http.routers.symfony-admin-assets.service=symfony"

      - "traefik.http.services.symfony.loadbalancer.server.port=80"

  vmauth:
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.vmui-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.vmui-ratelimit.ratelimit.burst=100"
      # Redirect root to /select/vmui/
      - "traefik.http.middlewares.vmui-redirect.redirectregex.regex=^https?://vmui\\.web3main\\.pro/?$$"
      - "traefik.http.middlewares.vmui-redirect.redirectregex.replacement=https://vmui.web3main.pro/select/vmui/"
      - "traefik.http.middlewares.vmui-redirect.redirectregex.permanent=false"
      # HTTP
      - "traefik.http.routers.vmui-http.rule=Host(`vmui.web3main.pro`)"
      - "traefik.http.routers.vmui-http.entrypoints=web"
      - "traefik.http.routers.vmui-http.middlewares=vmui-redirect@docker,vmui-ratelimit@docker"
      - "traefik.http.routers.vmui-http.service=vmui"
      # HTTPS
      - "traefik.http.routers.vmui-https.rule=Host(`vmui.web3main.pro`)"
      - "traefik.http.routers.vmui-https.entrypoints=websecure"
      - "traefik.http.routers.vmui-https.tls.certresolver=myresolver"
      - "traefik.http.routers.vmui-https.middlewares=vmui-redirect@docker,vmui-ratelimit@docker"
      - "traefik.http.services.vmui.loadbalancer.server.port=8427"

  api-go:
    env_file:
      - path: ./api-go/.env.production
        required: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-go-direct-http.rule=Host(`api.web3main.pro`)"
      - "traefik.http.routers.api-go-direct-http.priority=10"
      - "traefik.http.routers.api-go-direct-http.entrypoints=web"
      - "traefik.http.routers.api-go-direct-http.service=api-go"
      - "traefik.http.routers.api-go-direct.rule=Host(`api.web3main.pro`)"
      - "traefik.http.routers.api-go-direct.priority=10"
      - "traefik.http.routers.api-go-direct.entrypoints=websecure"
      - "traefik.http.routers.api-go-direct.tls.certresolver=myresolver"
      - "traefik.http.routers.api-go-direct.service=api-go"
      # Serve /storage/* (uploaded images, blog assets) from api-go on the public host.
      - "traefik.http.routers.api-go-storage-http.rule=(Host(`web3main.pro`) || Host(`www.web3main.pro`)) && PathPrefix(`/storage`)"
      - "traefik.http.routers.api-go-storage-http.priority=60"
      - "traefik.http.routers.api-go-storage-http.entrypoints=web"
      - "traefik.http.routers.api-go-storage-http.service=api-go"
      - "traefik.http.routers.api-go-storage.rule=(Host(`web3main.pro`) || Host(`www.web3main.pro`)) && PathPrefix(`/storage`)"
      - "traefik.http.routers.api-go-storage.priority=60"
      - "traefik.http.routers.api-go-storage.entrypoints=websecure"
      - "traefik.http.routers.api-go-storage.tls.certresolver=myresolver"
      - "traefik.http.routers.api-go-storage.service=api-go"
      # Serve SEO files from api-go on the public host.
      - "traefik.http.routers.api-go-seo.rule=(Host(`web3main.pro`) || Host(`www.web3main.pro`)) && (Path(`/sitemap.xml`) || Path(`/robots.txt`) || Path(`/llms.txt`))"
      - "traefik.http.routers.api-go-seo.priority=80"
      - "traefik.http.routers.api-go-seo.entrypoints=websecure"
      - "traefik.http.routers.api-go-seo.tls.certresolver=myresolver"
      - "traefik.http.routers.api-go-seo.service=api-go"
      - "traefik.http.services.api-go.loadbalancer.server.port=8081"

  astro-frontend:
    build:
      context: ./frontend-astro
      dockerfile: ./Dockerfile
      target: prod
      args:
        PUBLIC_SITE_URL: https://web3main.pro
        PUBLIC_SITE_TITLE: web3main.pro
        PUBLIC_SITE_AUTHOR: Web3main LLC
        PUBLIC_SITE_DESC: Stay updated with the latest trends in Web3 development, software engineering tips, and best coding practices for modern applications.
        PUBLIC_GOOGLE_SITE_VERIFICATION: ${PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    env_file:
      - ./frontend-astro/.env.production
    labels:
      - "traefik.enable=true"
      # HTTP
      - "traefik.http.routers.astro-http.rule=Host(`web3main.pro`) || Host(`www.web3main.pro`)"
      - "traefik.http.routers.astro-http.entrypoints=web"
      - "traefik.http.routers.astro-http.priority=10"
      - "traefik.http.routers.astro-http.service=astro"
      # HTTPS
      - "traefik.http.routers.astro.rule=Host(`web3main.pro`) || Host(`www.web3main.pro`)"
      - "traefik.http.routers.astro.entrypoints=websecure"
      - "traefik.http.routers.astro.tls.certresolver=myresolver"
      - "traefik.http.routers.astro.priority=10"
      - "traefik.http.routers.astro.service=astro"
      - "traefik.http.services.astro.loadbalancer.server.port=4321"

  jaeger:
    labels:
      - "traefik.enable=true"
      # Auth middleware
      - "traefik.http.middlewares.jaeger-auth.basicauth.users=${JAEGER_AUTH}"
      # HTTP
      - "traefik.http.routers.jaeger-http.rule=Host(`jaeger.web3main.pro`)"
      - "traefik.http.routers.jaeger-http.entrypoints=web"
      - "traefik.http.routers.jaeger-http.service=jaeger"
      # HTTPS
      - "traefik.http.routers.jaeger-https.rule=Host(`jaeger.web3main.pro`)"
      - "traefik.http.routers.jaeger-https.entrypoints=websecure"
      - "traefik.http.routers.jaeger-https.tls.certresolver=myresolver"
      - "traefik.http.routers.jaeger-https.service=jaeger"
      - "traefik.http.routers.jaeger-https.middlewares=jaeger-auth@docker"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"

volumes:
  astro_node_modules:
