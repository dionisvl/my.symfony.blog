services:
  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--tracing.otlp=true"
      - "--tracing.otlp.http=true"
      - "--tracing.otlp.http.endpoint=http://jaeger:4318/v1/traces"
      - "--tracing.serviceName=traefik"
      - "--tracing.addInternals=true"
    ports:
      - "80:80"
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=web"
    networks:
      - app-network

  symfony:
    build:
      context: ./api-symfony
      dockerfile: ./Dockerfile
      target: dev
    volumes:
      - ./api-symfony:/app:rw
      - ./api-symfony/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./api-symfony/php/conf.d/opcache.dev.ini:/usr/local/etc/php/conf.d/opcache.dev.ini:ro
    labels:
      - "traefik.enable=true"
      # Symfony serves ONLY admin/login/logout; the public front is Astro.
      - "traefik.http.routers.symfony.rule=Host(`${ASTRO_HOST}`) && (PathPrefix(`/admin`) || Path(`/login`) || Path(`/logout`))"
      - "traefik.http.routers.symfony.priority=50"
      - "traefik.http.routers.symfony.entrypoints=web"
      # Admin-only static assets that Symfony serves; route them to Symfony so Astro
      # (which owns /css/front.css etc.) doesn't swallow them with a 404.
      - "traefik.http.routers.symfony-admin-assets.rule=Host(`${ASTRO_HOST}`) && (Path(`/css/admin.css`) || Path(`/css/some_admin_fix.css`) || Path(`/css/bootstrap5-adminlte-compat.css`) || Path(`/js/admin.js`) || Path(`/js/some_fix_admin.js`))"
      - "traefik.http.routers.symfony-admin-assets.priority=70"
      - "traefik.http.routers.symfony-admin-assets.entrypoints=web"
      - "traefik.http.routers.symfony-admin-assets.service=symfony"
      - "traefik.http.services.symfony.loadbalancer.server.port=80"

  pets-app:
    volumes:
      - /var/www/my.fb.admin/var/www/pets.phpqa.ru/app:/app:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pets.rule=Host(`pets.local`)"
      - "traefik.http.routers.pets.entrypoints=web"
      - "traefik.http.services.pets.loadbalancer.server.port=80"

  postgres:
    ports:
      - "${DB_PORT_EXTERNAL}:5432"

  vmauth:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vmui.rule=Host(`logs.localhost`)"
      - "traefik.http.services.vmui.loadbalancer.server.port=8427"
      - "traefik.http.routers.vmui.entrypoints=web"

  jaeger:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jaeger.rule=Host(`jaeger.localhost`)"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"
      - "traefik.http.routers.jaeger.entrypoints=web"

  api-go:
    env_file:
      - path: ./api-go/.env
        required: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-go-direct.rule=Host(`${API_GO_HOST}`)"
      - "traefik.http.routers.api-go-direct.priority=10"
      - "traefik.http.routers.api-go-direct.entrypoints=web"
      - "traefik.http.routers.api-go-direct.service=api-go"
      # Serve /storage/* (uploaded images, blog assets) from api-go on the public host
      - "traefik.http.routers.api-go-storage.rule=Host(`${ASTRO_HOST}`) && PathPrefix(`/storage`)"
      - "traefik.http.routers.api-go-storage.priority=60"
      - "traefik.http.routers.api-go-storage.entrypoints=web"
      - "traefik.http.routers.api-go-storage.service=api-go"
      - "traefik.http.services.api-go.loadbalancer.server.port=8081"

  astro-frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable pnpm && pnpm install && pnpm dev --host 0.0.0.0 --port 4321"
    env_file:
      - ./frontend-astro/.env
    volumes:
      - ./frontend-astro:/app:rw
      - astro_node_modules:/app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.astro.rule=Host(`${ASTRO_HOST}`)"
      - "traefik.http.routers.astro.priority=10"
      - "traefik.http.routers.astro.entrypoints=web"
      - "traefik.http.services.astro.loadbalancer.server.port=4321"

